name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Structural and packaging checks
        run: python3 scripts/check.py
      - name: Checker tests
        run: python3 -m unittest discover -s tests -v
      - name: Official Agent Skills validator (pinned)
        env:
          PYTHONUTF8: '1'
        run: |
          python3 -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
          for dir in plugin/skills/*/; do skills-ref validate "$dir"; done
  claude-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace and plugin manifests
        # Warnings are expected (no `version` by design, decision D2), so this is not --strict.
        run: |
          claude plugin validate .
          claude plugin validate ./plugin
