name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Structural and packaging checks
        run: python3 scripts/check.py
      - name: Checker tests
        run: python3 -m unittest discover -s tests -v
